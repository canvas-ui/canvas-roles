name: canvas-captured

services:
  token-init:
    build:
      context: .
      target: egress
    image: canvas-captured-egress:0.1.0
    command: [node, src/init-token.js]
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    environment:
      CAPTURE_TOKEN_FILE: /run/secrets/capture-token
    volumes:
      - ${CAPTURE_SECRETS_DIR:-./secrets}:/run/secrets

  captured:
    build:
      context: .
      target: capture
    image: canvas-captured:0.1.0
    network_mode: host
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/chromium-seccomp.json
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    environment:
      CAPTURE_HOST: ${CAPTURE_BIND_ADDRESS:-127.0.0.1}
      CAPTURE_PORT: ${CAPTURE_PORT:-8085}
      CAPTURE_TOKEN_FILE: /run/secrets/capture-token
      CAPTURE_PROXY_URL: http://127.0.0.1:${CAPTURE_PROXY_PORT:-3128}
      CAPTURE_CONCURRENCY: ${CAPTURE_CONCURRENCY:-1}
      CAPTURE_TIMEOUT_MS: ${CAPTURE_TIMEOUT_MS:-120000}
      CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-33554432}
    volumes:
      - ${CAPTURE_SECRETS_DIR:-./secrets}:/run/secrets:ro
    depends_on:
      token-init:
        condition: service_completed_successfully
      egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "let h=process.env.CAPTURE_HOST;h=h==='0.0.0.0'?'127.0.0.1':h==='::'?'::1':h;fetch('http://'+(h.includes(':')?'['+h+']':h)+':'+process.env.CAPTURE_PORT+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  egress:
    build:
      context: .
      target: egress
    image: canvas-captured-egress:0.1.0
    network_mode: host
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    environment:
      PROXY_PORT: ${CAPTURE_PROXY_PORT:-3128}
    healthcheck:
      test: [CMD, node, -e, "const s=require('net').connect(Number(process.env.PROXY_PORT),'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
