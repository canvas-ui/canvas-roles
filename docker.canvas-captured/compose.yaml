name: canvas-captured

services:
  api:
    image: nginx:1.30.6-alpine
    command: [nginx, -g, "daemon off;"]
    entrypoint: []
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 32m
    cpus: 0.25
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${CAPTURE_BIND_ADDRESS:-127.0.0.1}:${CAPTURE_HOST_PORT:-8085}:8080"
    networks:
      capture:
        ipv4_address: ${CAPTURE_NETWORK_PREFIX:-172.30.86}.4
      ingress: {}
    depends_on:
      captured:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  captured:
    build:
      context: .
      target: capture
    image: canvas-captured:0.1.0
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/chromium-seccomp.json
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    environment:
      CAPTURE_TOKEN_FILE: /run/secrets/capture_token
      CAPTURE_PROXY_URL: http://${CAPTURE_NETWORK_PREFIX:-172.30.86}.2:3128
      CAPTURE_CONCURRENCY: ${CAPTURE_CONCURRENCY:-1}
      CAPTURE_TIMEOUT_MS: ${CAPTURE_TIMEOUT_MS:-120000}
      CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-33554432}
    secrets: [capture_token]
    networks:
      capture:
        ipv4_address: ${CAPTURE_NETWORK_PREFIX:-172.30.86}.3
    depends_on:
      egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  egress:
    build:
      context: .
      target: egress
    image: canvas-captured-egress:0.1.0
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    environment:
      PROXY_HOST: ${CAPTURE_NETWORK_PREFIX:-172.30.86}.2
    networks:
      capture:
        ipv4_address: ${CAPTURE_NETWORK_PREFIX:-172.30.86}.2
      internet: {}
    healthcheck:
      test: [CMD, node, -e, "const s=require('net').connect(3128,process.env.PROXY_HOST,()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  capture:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: "${CAPTURE_NETWORK_PREFIX:-172.30.86}.0/24" }]
  internet: {}
  ingress: {}

secrets:
  capture_token:
    file: ./secrets/capture-token
