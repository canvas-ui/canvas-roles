worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 5s;
    server {
        listen 8080;
        error_page 413 = @too_large;
        error_page 502 504 = @unavailable;
        location @too_large {
            default_type application/json;
            return 413 '{"error":{"code":"request_too_large","message":"JSON request exceeds 16384 bytes"}}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"unavailable","message":"Capture service is unavailable"}}';
        }
        location / {
            proxy_pass http://captured:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 310s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_ignore_client_abort off;
            proxy_next_upstream off;
        }
    }
}
